<div class="page-container">
  <div class="page-header">
    <div>
      <h1 class="page-title">Signatários</h1>
      <p class="page-subtitle">Gerencie o cadastro de signatários</p>
    </div>
    <button mat-raised-button color="primary" (click)="openCreate()">
      <mat-icon>person_add</mat-icon>
      Novo Signatário
    </button>
  </div>

  @if (loading) {
    <div class="loading-wrapper">
      <mat-spinner diameter="48"></mat-spinner>
    </div>
  } @else {
    <mat-card>
      <mat-card-content>
        @if (signers.length === 0) {
          <div class="empty-state">
            <mat-icon class="empty-icon">people</mat-icon>
            <p>Nenhum signatário cadastrado.</p>
            <button mat-stroked-button color="primary" (click)="openCreate()">
              Cadastrar primeiro signatário
            </button>
          </div>
        } @else {
          <table mat-table [dataSource]="signers" class="full-width-table">
            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef>Nome</th>
              <td mat-cell *matCellDef="let row">{{ row.name }}</td>
            </ng-container>

            <ng-container matColumnDef="email">
              <th mat-header-cell *matHeaderCellDef>E-mail</th>
              <td mat-cell *matCellDef="let row">{{ row.email }}</td>
            </ng-container>

            <ng-container matColumnDef="status">
              <th mat-header-cell *matHeaderCellDef>Status</th>
              <td mat-cell *matCellDef="let row">
                <app-status-chip [status]="row.status"></app-status-chip>
              </td>
            </ng-container>

            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef>Ações</th>
              <td mat-cell *matCellDef="let row">
                <button mat-icon-button color="primary" (click)="openEdit(row)" matTooltip="Editar">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="confirmDelete(row)" matTooltip="Excluir">
                  <mat-icon>delete</mat-icon>
                </button>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
        }
      </mat-card-content>
    </mat-card>
  }
</div>
