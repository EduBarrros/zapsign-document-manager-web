<div class="login-page">
  <mat-card class="login-card">
    <mat-card-header>
      <div class="login-brand">
        <mat-icon class="brand-icon">description</mat-icon>
        <h1 class="brand-title">ZapSign Manager</h1>
      </div>
      <p class="brand-subtitle">Faça login para continuar</p>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuário</mat-label>
          <mat-icon matPrefix>person</mat-icon>
          <input matInput formControlName="username" autocomplete="username" />
          @if (form.get('username')?.hasError('required') && form.get('username')?.touched) {
            <mat-error>Usuário é obrigatório.</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Senha</mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <input
            matInput
            formControlName="password"
            [type]="hidePassword ? 'password' : 'text'"
            autocomplete="current-password"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword = !hidePassword"
            [attr.aria-label]="hidePassword ? 'Mostrar senha' : 'Ocultar senha'"
          >
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          @if (form.get('password')?.hasError('required') && form.get('password')?.touched) {
            <mat-error>Senha é obrigatória.</mat-error>
          }
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="submit-btn"
          [disabled]="loading || form.invalid"
        >
          @if (loading) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            Entrar
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
